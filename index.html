<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fb7185" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji@15.0.0/color/618x618/2764.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="恋爱纪念册" />
<title>恋爱纪念册</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(180deg,#fff1f2,#fdf2f8 50%,#fff1f2); min-height:100vh; color:#1f2937; }
  .wrap { max-width:28rem; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  header { position:sticky; top:0; z-index:40; background:rgba(255,255,255,.85); backdrop-filter:blur(8px); border-bottom:1px solid #ffe4e6; padding:14px 20px; text-align:center; }
  header h1 { font-size:18px; color:#e11d48; }
  main { flex:1; padding:20px 16px 96px; }
  nav { position:fixed; bottom:0; left:0; right:0; z-index:40; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); border-top:1px solid #ffe4e6; }
  nav .inner { max-width:28rem; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
  nav button { background:none; border:none; padding:10px 0; display:flex; flex-direction:column; align-items:center; gap:2px; color:#9ca3af; font-size:10px; cursor:pointer; }
  nav button.on { color:#f43f5e; }
  nav button .ico { font-size:20px; line-height:1; }
  .card { background:#fff; border-radius:24px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:16px; }
  .hero { background:linear-gradient(135deg,#fb7185,#f472b6,#f43f5e); color:#fff; text-align:center; border-radius:24px; padding:28px 20px; box-shadow:0 10px 25px rgba(251,113,133,.35); margin-bottom:16px; position:relative; overflow:hidden; }
  .hero .days { font-size:56px; font-weight:800; margin:6px 0; }
  .hero .sub { color:#ffe4e6; font-size:14px; }
  .hero .small { color:rgba(255,228,230,.8); font-size:12px; margin-top:10px; }
  .sec-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .sec-title h2 { font-size:16px; font-weight:600; }
  .link-btn { background:none; border:none; color:#f43f5e; font-size:14px; font-weight:500; cursor:pointer; }
  .row { display:flex; align-items:center; justify-content:space-between; background:#fff1f2; border-radius:16px; padding:12px 16px; margin-bottom:10px; }
  .row .t { font-weight:500; font-size:14px; }
  .row .d { font-size:12px; color:#9ca3af; margin-top:2px; }
  .row .n { font-size:14px; font-weight:600; color:#6b7280; white-space:nowrap; }
  .row .n.today { color:#f43f5e; }
  .del { background:none; border:none; color:#d1d5db; font-size:16px; cursor:pointer; padding:4px; }
  .empty { text-align:center; color:#9ca3af; font-size:14px; padding:20px 0; }
  .btn-primary { width:100%; border:none; border-radius:16px; background:linear-gradient(90deg,#fb7185,#ec4899); color:#fff; font-weight:600; padding:14px; font-size:15px; cursor:pointer; box-shadow:0 4px 12px rgba(251,113,133,.3); }
  .btn-primary:disabled { opacity:.4; }
  .btn-primary:active { transform:scale(.97); }
  .btn-ghost { width:100%; border:none; border-radius:16px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06); color:#f43f5e; font-weight:500; padding:12px; font-size:14px; cursor:pointer; margin-bottom:16px; }
  input[type=text], input[type=date], textarea { width:100%; border:1px solid #fecdd3; border-radius:16px; padding:12px 16px; font-size:15px; outline:none; font-family:inherit; background:#fff; }
  input:focus, textarea:focus { border-color:#fb7185; }
  textarea { resize:none; }
  .overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; }
  .sheet { width:100%; max-width:28rem; background:#fff; border-radius:24px 24px 0 0; padding:24px; }
  .sheet h3 { font-size:18px; font-weight:600; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .sheet .x { background:none; border:none; color:#9ca3af; font-size:20px; cursor:pointer; }
  .sheet > * + * { margin-top:14px; }
  .checkline { display:flex; align-items:center; gap:8px; font-size:14px; color:#4b5563; }
  .checkline input { width:16px; height:16px; accent-color:#f43f5e; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .photo-cell { border-radius:16px; overflow:hidden; background:#fff1f2; aspect-ratio:1; box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer; }
  .photo-cell img { width:100%; height:100%; object-fit:cover; }
  .photo-cap { font-size:12px; color:#4b5563; margin-top:4px; padding:0 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .upload-box { width:100%; border:2px dashed #fda4af; border-radius:24px; background:#fff; padding:32px; color:#f43f5e; font-size:14px; font-weight:500; cursor:pointer; margin-bottom:16px; }
  .todo { display:flex; align-items:flex-start; gap:12px; background:#fff; border-radius:16px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:10px; }
  .todo.done { opacity:.6; }
  .todo .circle { width:24px; height:24px; border-radius:50%; border:2px solid #fda4af; flex-shrink:0; margin-top:2px; background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
  .todo.done .circle { background:#f43f5e; border-color:#f43f5e; }
  .todo .body { flex:1; min-width:0; }
  .todo .title { font-weight:500; font-size:15px; }
  .todo.done .title { text-decoration:line-through; color:#9ca3af; }
  .todo .note { font-size:12px; color:#9ca3af; margin-top:2px; }
  .todo .when { font-size:12px; color:#fb7185; margin-top:2px; }
  .tabs2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; background:#fff; border-radius:16px; padding:6px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:16px; }
  .tabs2 button { border:none; border-radius:12px; padding:10px; font-size:14px; font-weight:500; color:#6b7280; background:none; cursor:pointer; }
  .tabs2 button.on { background:linear-gradient(90deg,#fb7185,#ec4899); color:#fff; }
  .mood { display:flex; align-items:flex-start; gap:12px; background:#fff; border-radius:16px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:10px; }
  .mood .emo { font-size:28px; }
  .mood .who { font-size:14px; font-weight:600; color:#f43f5e; }
  .mood .date { font-size:12px; color:#9ca3af; margin-left:8px; font-weight:400; }
  .mood .txt { font-size:14px; color:#374151; margin-top:4px; }
  .whisper { background:linear-gradient(135deg,#fff1f2,#fdf2f8); border:1px solid #ffe4e6; border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .whisper .meta { display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; }
  .whisper .who { color:#f43f5e; font-weight:600; }
  .whisper .date { color:#9ca3af; }
  .whisper .txt { font-size:14px; color:#374151; line-height:1.6; }
  .emoji-row { display:flex; gap:8px; flex-wrap:wrap; }
  .emoji-row button { font-size:22px; width:44px; height:44px; border-radius:16px; border:none; background:#f9fafb; cursor:pointer; }
  .emoji-row button.on { background:#ffe4e6; box-shadow:0 0 0 2px #fb7185; transform:scale(1.1); }
  .who-row { display:flex; gap:8px; }
  .who-row button { flex:1; border:none; border-radius:12px; padding:10px; font-size:14px; font-weight:500; background:#fff1f2; color:#f43f5e; cursor:pointer; }
  .who-row button.on { background:#f43f5e; color:#fff; }
  .capsule-hero { background:linear-gradient(90deg,#a78bfa,#e879f9); color:#fff; border-radius:24px; padding:20px; box-shadow:0 10px 25px rgba(232,121,249,.3); margin-bottom:16px; }
  .capsule-hero .sub { color:#fae8ff; font-size:14px; }
  .capsule-hero .big { font-size:18px; font-weight:700; margin-top:4px; }
  .cap-item { background:#fff; border-radius:16px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:12px; }
  .cap-head { display:flex; align-items:center; justify-content:space-between; }
  .cap-left { display:flex; align-items:center; gap:12px; }
  .cap-ico { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; background:#f3f4f6; }
  .cap-ico.ready { background:#fef3c7; }
  .cap-ico.open { background:#fae8ff; }
  .cap-st { font-weight:500; font-size:14px; }
  .cap-dates { font-size:12px; color:#9ca3af; margin-top:2px; }
  .cap-text { margin-top:12px; background:#fdf4ff; border:1px solid #fae8ff; border-radius:12px; padding:12px; font-size:14px; color:#374151; line-height:1.6; }
  .btn-open { margin-top:12px; width:100%; border:none; border-radius:12px; background:linear-gradient(90deg,#fbbf24,#fb923c); color:#fff; font-weight:600; padding:10px; font-size:14px; cursor:pointer; }
  .btn-fuchsia { width:100%; border:none; border-radius:16px; background:linear-gradient(90deg,#a78bfa,#e879f9); color:#fff; font-weight:600; padding:14px; font-size:15px; cursor:pointer; }
  .btn-fuchsia:disabled { opacity:.4; }
  .setup { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; background:linear-gradient(180deg,#ffe4e6,#fdf2f8 60%,#fff); }
  .setup .heart { font-size:40px; animation:beat 1.2s infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .setup h1 { font-size:28px; color:#e11d48; margin:8px 0 4px; }
  .setup p { color:#fb7185; font-size:14px; margin-bottom:28px; }
  .setup .form { width:100%; max-width:20rem; }
  .setup label { display:block; font-size:14px; color:#f43f5e; margin:14px 0 6px; }
  .setup .btn-primary { margin-top:22px; }
  .setup .divider { display:flex; align-items:center; gap:10px; color:#9ca3af; font-size:12px; margin:26px 0 14px; width:100%; max-width:20rem; }
  .setup .divider::before, .setup .divider::after { content:''; flex:1; height:1px; background:#fecdd3; }
  .viewer { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
  .viewer img { max-width:100%; max-height:70vh; border-radius:16px; object-fit:contain; }
  .viewer .cap { color:rgba(255,255,255,.9); margin-top:14px; font-size:14px; text-align:center; }
  .viewer .acts { display:flex; gap:12px; margin-top:14px; }
  .viewer .acts button { border:none; border-radius:999px; padding:8px 20px; font-size:14px; cursor:pointer; background:rgba(255,255,255,.2); color:#fff; }
  .viewer .acts button.danger { background:rgba(244,63,94,.8); }
  #installBar { position:fixed; top:0; left:0; right:0; z-index:70; display:none; justify-content:center; }
  #installBar .box { margin:10px; max-width:28rem; width:calc(100% - 20px); background:linear-gradient(90deg,#fb7185,#ec4899); color:#fff; border-radius:16px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 8px 20px rgba(251,113,133,.4); font-size:14px; }
  #installBar button { border:none; border-radius:999px; background:#fff; color:#f43f5e; font-weight:600; padding:8px 16px; font-size:13px; cursor:pointer; flex-shrink:0; margin-left:10px; }
  #installBar .close { background:none; color:rgba(255,255,255,.8); padding:8px 4px; font-weight:400; }
  .sync-code { flex:1; background:#fff1f2; border-radius:14px; padding:12px; font-size:22px; font-weight:800; letter-spacing:6px; text-align:center; color:#e11d48; }
  #syncDot { font-size:12px; color:#9ca3af; font-weight:400; }
</style>
</head>
<body>
<div id="app"></div>
<div id="installBar"><div class="box"><span id="installTip">📲 点这里，把它装到手机桌面</span><button id="installBtn">安装</button><button class="close" id="installClose">✕</button></div></div>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
<script>
"use strict";
/* ============ 数据层 ============ */
const K = {
  profile: 'love.profile', anniversaries: 'love.anniversaries', photos: 'love.photos',
  things: 'love.things', moods: 'love.moods', whispers: 'love.whispers', capsules: 'love.capsules'
};
const load = (k, fb) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch { return fb; } };
const rawSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { alert('存储空间不足，照片可能太多了'); } };
const save = (k, v) => { rawSet(k, v); markChanged(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtDate = iso => { const [y, m, d] = iso.split('-'); return `${y}年${+m}月${+d}日`; };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
function nextOccurrence(date, yearly) {
  const today = new Date(todayStr() + 'T00:00:00');
  const [y0, m, d] = date.split('-').map(Number);
  let t = yearly ? new Date(today.getFullYear(), m - 1, d) : new Date(y0, m - 1, d);
  if (yearly && t < today) t = new Date(today.getFullYear() + 1, m - 1, d);
  return Math.round((t - today) / 86400000);
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

let S = {
  profile: load(K.profile, null),
  tab: 'home',
  sheet: null,
  diaryTab: 'mood',
  viewing: null,
  opening: null,
  joining: false,
  joinFailed: false,
};
const P = () => S.profile;

/* ============ 主渲染 ============ */
const TABS = [
  ['home', '💗', '首页', '恋爱纪念册'],
  ['album', '🖼️', '相册', '共同相册'],
  ['things', '✅', '清单', '一起完成的事'],
  ['diary', '📖', '日记', '心情与悄悄话'],
  ['capsule', '⏳', '胶囊', '时光胶囊'],
];

function render() {
  const app = document.getElementById('app');
  if (S.joining) { app.innerHTML = viewJoining(); return; }
  if (S.joinFailed) { app.innerHTML = viewJoinFailed(); return; }
  if (!S.profile) { app.innerHTML = viewSetup(); return; }
  const cur = TABS.find(t => t[0] === S.tab);
  app.innerHTML = `<div class="wrap">
    <header><h1>${cur[3]}</h1></header>
    <main>${viewTab()}</main>
    <nav><div class="inner">${TABS.map(t =>
      `<button class="${S.tab === t[0] ? 'on' : ''}" data-action="tab" data-v="${t[0]}">
        <span class="ico">${t[1]}</span><span>${t[2]}</span></button>`).join('')}
    </div></nav>
  </div>` + viewOverlays();
  renderSyncDot();
}

function viewTab() {
  switch (S.tab) {
    case 'home': return viewHome();
    case 'album': return viewAlbum();
    case 'things': return viewThings();
    case 'diary': return viewDiary();
    case 'capsule': return viewCapsule();
  }
  return '';
}

/* ============ 设置页 ============ */
function viewSetup() {
  return `<div class="setup">
    <div class="heart">❤️</div>
    <h1>恋爱纪念册</h1>
    <p>先认识一下你们吧 💕</p>
    <div class="form">
      <label>你的名字</label>
      <input type="text" id="sName1" placeholder="比如：小明" />
      <label>TA 的名字</label>
      <input type="text" id="sName2" placeholder="比如：小红" />
      <label>我们在一起的日子</label>
      <input type="date" id="sDate" value="${todayStr()}" max="${todayStr()}" />
      <button class="btn-primary" data-action="doSetup">开始我们的故事 ❤️</button>
    </div>
    <div class="divider">另一半已经创建好了？</div>
    <div class="form">
      <input type="text" id="sJoinCode" placeholder="输入 TA 的配对码（6 位字母数字）" style="text-transform:uppercase" />
      <button class="btn-primary" data-action="joinSpace" style="margin-top:12px;background:linear-gradient(90deg,#a78bfa,#e879f9)">加入我们的空间 💞</button>
    </div>
  </div>`;
}

function viewJoining() {
  return `<div class="setup">
    <div class="heart">💞</div>
    <h1 style="font-size:22px">正在同步…</h1>
    <p>正在从你们的专属云空间获取回忆，第一次同步需要几秒钟</p>
  </div>`;
}

function viewJoinFailed() {
  return `<div class="setup">
    <div class="heart">🥺</div>
    <h1 style="font-size:22px">暂时没有同步到数据</h1>
    <p style="line-height:1.8">请确认：<br/>1. 配对码没有输错（也可以让 TA 重新发一次邀请链接，点开就能配对）<br/>2. 手机连着网<br/>3. TA 已经创建好了你们的空间</p>
    <div class="form">
      <button class="btn-primary" data-action="retryJoin">重试同步</button>
      <button class="btn-ghost" data-action="freshStart" style="margin-top:12px;margin-bottom:0">配对码搞错了？重新输入</button>
    </div>
  </div>`;
}

/* ============ 首页 ============ */
function viewHome() {
  const p = P();
  const days = daysBetween(p.startDate, todayStr()) + 1;
  const targets = [100, 200, 365, 520, 730, 1000, 1314, 2000];
  const start = new Date(p.startDate + 'T00:00:00');
  const miles = targets.map(n => {
    const d = new Date(start.getTime() + (n - 1) * 86400000);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    return { n, left: daysBetween(todayStr(), iso) };
  }).filter(m => m.left >= 0).slice(0, 3);

  const annis = load(K.anniversaries, [])
    .map(a => ({ ...a, left: nextOccurrence(a.date, a.yearly) }))
    .sort((a, b) => a.left - b.left);

  return `
  <div class="hero">
    <div class="sub">${esc(p.name1)} ❤ ${esc(p.name2)}</div>
    <div class="sub" style="margin-top:8px">我们已经在一起</div>
    <div class="days">${days}</div>
    <div class="sub">天</div>
    <div class="small">始于 ${fmtDate(p.startDate)}</div>
  </div>
  <div class="card">
    <div class="sec-title"><h2>💞 情侣同步</h2><span id="syncDot">…</span></div>
    <div style="font-size:13px;color:#6b7280;line-height:1.6;margin-bottom:10px">点「邀请 TA」，把链接用微信发给另一半，TA 点开就自动配对，不用输码。之后两部手机实时同步、一起编辑。</div>
    <button class="btn-primary" data-action="copyInvite" style="margin-bottom:10px">🔗 邀请 TA（复制邀请链接）</button>
    <div style="font-size:12px;color:#9ca3af;text-align:center;line-height:1.8">TA 也可以手动输入配对码：<b style="color:#e11d48;letter-spacing:3px;font-size:16px">${esc(SYNC.code || '')}</b>
      <button class="link-btn" data-action="copyCode" style="margin-left:6px">复制</button></div>
  </div>
  ${miles.length ? `<div class="card">
    <div class="sec-title"><h2>✨ 即将到来的里程碑</h2></div>
    ${miles.map(m => `<div style="display:flex;justify-content:space-between;font-size:14px;padding:5px 0">
      <span style="color:#4b5563">在一起 ${m.n} 天</span>
      <span style="color:${m.left === 0 ? '#f43f5e' : '#9ca3af'};font-weight:${m.left === 0 ? 600 : 400}">
        ${m.left === 0 ? '就是今天！🎉' : '还有 ' + m.left + ' 天'}</span>
    </div>`).join('')}
  </div>` : ''}
  <div class="card">
    <div class="sec-title"><h2>🔔 纪念日提醒</h2>
      <button class="link-btn" data-action="sheet" data-v="addAnni">＋ 添加</button></div>
    ${annis.length === 0 ? '<div class="empty">还没有纪念日，点「添加」记下 TA 的生日、第一次见面……</div>' :
      annis.map(a => `<div class="row">
        <div><div class="t">${esc(a.title)}</div>
          <div class="d">${fmtDate(a.date)}${a.yearly ? ' · 每年' : ''}</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="n ${a.left === 0 ? 'today' : ''}">${a.left === 0 ? '就是今天 🎉' : a.left + ' 天后'}</span>
          <button class="del" data-action="delAnni" data-v="${a.id}">🗑</button>
        </div></div>`).join('')}
  </div>
  <div class="card">

/* 云端只保存密文：内容在手机上用配对码生成的密钥加密后才上传，别人（包括服务器）都看不到明文 */
const SUPA = {
  url: 'https://ddjiwhdrojjbwccswipp.supabase.co',
  key: 'sb_publishable_lf-sTaM9hy57p5ktWhYDmQ_Ju0Hs9ST',

const SYNC = {
  code: load('love.syncCode', null),
  connected: false, gotRemote: false, started: false, polling: false,
  pubTimer: null, pollTimer: null, key: null, lastMeta: [],
};
const genCode = () => {
  const chars = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
  let c = '';
  const rnd = crypto.getRandomValues(new Uint8Array(6));
  for (let i = 0; i < 6; i++) c += chars[rnd[i] % chars.length];
  return c;
};
const localUpdatedAt = () => Number(localStorage.getItem('love.updatedAt') || 0);

function applyState(st) {
  const defs = { profile: null, anniversaries: [], things: [], moods: [], whispers: [], capsules: [] };
  Object.keys(defs).forEach(k => {

  // 用对方的照片清单校对本地相册：删掉对方已删的，更新描述；本机刚传还没发上去的保留
  const meta = st.photosMeta || [];
  const metaIds = new Set(meta.map(m => m.id));
  const pub = new Set(publishedIds());
  const locals = load(K.photos, []);
  const merged = [];

/* 加解密：密钥由配对码推导，不知道配对码的人（包括服务器）看到的是密文 */
async function syncKey() {
  if (SYNC.key) return SYNC.key;
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('love-sync-key:' + SYNC.code));
  SYNC.key = await crypto.subtle.importKey('raw', h, 'AES-GCM', false, ['encrypt', 'decrypt']);
  return SYNC.key;
}
function u8ToB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToU8(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function encText(text) {
  const key = await syncKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv); out.set(new Uint8Array(ct), 12);
  return u8ToB64(out);
}
async function decText(b64) {
  const key = await syncKey();
  const u = b64ToU8(b64);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12));
  return new TextDecoder().decode(pt);
}

/* 云端读写（Supabase 数据表 love_sync） */
const sbHead = () => ({ 'apikey': SUPA.key, 'Authorization': 'Bearer ' + SUPA.key, 'Content-Type': 'application/json' });
async function sbGet(rowId) {
  const r = await fetch(SUPA.url + '/rest/v1/love_sync?id=eq.' + encodeURIComponent(rowId) + '&select=data,updated_at', { headers: sbHead() });
  if (!r.ok) throw new Error('http ' + r.status);
  const rows = await r.json();
  return rows && rows[0] ? rows[0] : null;
}
async function sbPut(rowId, dataObj, updatedAt) {
  const r = await fetch(SUPA.url + '/rest/v1/love_sync', {
    method: 'POST',
    headers: Object.assign(sbHead(), { 'Prefer': 'resolution=merge-duplicates' }),
    body: JSON.stringify([{ id: rowId, data: dataObj, updated_at: updatedAt }]),
  });
  if (!r.ok) throw new Error('http ' + r.status);
}
async function sbDel(rowId) {
  try { await fetch(SUPA.url + '/rest/v1/love_sync?id=eq.' + encodeURIComponent(rowId), { method: 'DELETE', headers: sbHead() }); } catch { /* 忽略 */ }
}

async function publishState() {
  if (!SYNC.code) return;
  const st = collectState();
  if (!st.profile) return; // 空档案不发布，防止覆盖对方数据
  try {
    await sbPut(SYNC.code, { e: await encText(JSON.stringify(st)) }, st.updatedAt);
    SYNC.connected = true;
  } catch { SYNC.connected = false; /* 下次轮询时自动补发 */ }
  renderSyncDot();
}
async function publishPhoto(p) {
  if (!SYNC.code || !p) return;

    await sbPut(photoRowId(p.id), { e: await encText(p.dataUrl) }, Date.now());

}

/* 从云端拉一次数据 */
async function pullOnce() {
  if (!SYNC.code || SYNC.polling) return;
  SYNC.polling = true;
  try {
    const row = await sbGet(SYNC.code);
    SYNC.connected = true; renderSyncDot();
    if (row && row.data && row.data.e) {
      const st = JSON.parse(await decText(row.data.e));
      if (st && typeof st.updatedAt === 'number') {
        SYNC.gotRemote = true;
        SYNC.lastMeta = st.photosMeta || [];
        if (st.updatedAt > localUpdatedAt()) {
          applyState(st);
          S.joining = false; S.joinFailed = false;
          render();
        } else if (st.updatedAt < localUpdatedAt() && load(K.profile, null)) {
          publishState(); // 本机更新，把新数据推给 TA
        }
      }
    } else {
      SYNC.lastMeta = [];
      // 云端还没有数据：本机有档案就发布上去（首次创建 / 云端数据丢失时恢复）
      if (load(K.profile, null)) { publishState(); publishNewPhotos(true); }
    }
    await pullMissingPhotos();
  } catch {
    SYNC.connected = false; renderSyncDot();
  } finally {
    SYNC.polling = false;
  }
}
/* 对方新传的照片，逐张拉下来 */
async function pullMissingPhotos() {
  const metas = SYNC.lastMeta || [];
  if (!metas.length) return;
  let changed = false;
  for (const m of metas) {
    if (load(K.photos, []).some(p => p.id === m.id)) continue;
    try {
      const row = await sbGet(photoRowId(m.id));
      if (!row || !row.data || !row.data.e) continue;
      const dataUrl = await decText(row.data.e);
      const list = load(K.photos, []);
      if (!list.some(p => p.id === m.id)) {
        list.unshift({ id: m.id, dataUrl, caption: m.caption || '', date: m.date || todayStr() });
        rawSet(K.photos, list);
        changed = true;
      }
    } catch { /* 下轮再试 */ }
  }
  if (changed && S.profile && S.tab === 'album') render();
}

window.__startSync = function () {
  if (SYNC.started || !SYNC.code) return;
  SYNC.started = true; renderSyncDot();
  pullOnce();
  SYNC.pollTimer = setInterval(pullOnce, 5000); // 每 5 秒和云端对一次，一直同步
};

    case 'pickEmoji':
      pickedEmoji = v;
      document.querySelectorAll('#fEmojiRow button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
      break;
    case 'pickWho':
      pickedWho = v;
      el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
      break;

    case 'doSetup': {
      const n1 = gv('sName1'), n2 = gv('sName2'), d = $('sDate').value;
      if (!n1 || !n2 || !d) { alert('把名字和日期都填上哦'); return; }
      if (!SYNC.code) { SYNC.code = genCode(); rawSet('love.syncCode', SYNC.code); }
      S.profile = { name1: n1, name2: n2, startDate: d };
      save(K.profile, S.profile);
      window.__startSync();
      render(); break;
    }
    case 'joinSpace': {
      const c = gv('sJoinCode').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (c.length < 4) { alert('配对码不对哦，找 TA 要一下（6 位字母数字）'); return; }
      SYNC.code = c; rawSet('love.syncCode', c);
      S.joining = true; S.joinFailed = false; render();
      window.__startSync();
      setTimeout(() => { if (S.joining && !S.profile) { S.joining = false; S.joinFailed = true; render(); } }, 15000);
      break;
    }
    case 'retryJoin':
      S.joinFailed = false; S.joining = true; render();
      pullOnce();
      setTimeout(() => { if (S.joining && !S.profile) { S.joining = false; S.joinFailed = true; render(); } }, 15000);
      break;
    case 'freshStart':
      localStorage.removeItem('love.syncCode'); SYNC.code = null;
      S.joinFailed = false; S.joining = false; render();
      break;
    case 'copyInvite': {
      const link = location.origin + location.pathname + '#join=' + (SYNC.code || '');
      const done2 = () => alert('邀请链接已复制，用微信发给 TA 吧 💌\nTA 点开链接就会自动配对，不用输码');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done2).catch(() => { prompt('长按复制邀请链接：', link); });
      } else {
        prompt('长按复制邀请链接：', link);
      }
      break;
    }
    case 'copyCode': {
      const code = SYNC.code || '';
      const done2 = () => alert('配对码已复制，用微信发给 TA 吧 💌');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done2).catch(() => { prompt('长按复制配对码：', code); });
      } else {
        prompt('长按复制配对码：', code);
      }
      break;
    }

    case 'saveAnni': {
      const t = gv('fTitle'), d = $('fDate').value;
      if (!t || !d) { alert('名称和日期都要填哦'); return; }
      const list = load(K.anniversaries, []);
      list.push({ id: uid(), title: t, date: d, yearly: $('fYearly').checked });
      save(K.anniversaries, list); S.sheet = null; render(); break;
    }
    case 'delAnni':
      save(K.anniversaries, load(K.anniversaries, []).filter(x => x.id !== v)); render(); break;

    case 'upload': $('fileInput').click(); break;
    case 'view': S.viewing = v; render(); break;
    case 'delPhoto':
      if (!confirm('确定删除这张照片吗？')) return;
      save(K.photos, load(K.photos, []).filter(x => x.id !== v));
      clearRemotePhoto(v);
      S.viewing = null; render(); break;
    case 'editCaption': S.sheet = 'caption'; S.captionId = v; render();
      { const ph = load(K.photos, []).find(x => x.id === v); if (ph) $('fCaption').value = ph.caption; } break;
    case 'saveCaption': {
      const list = load(K.photos, []);
      const ph = list.find(x => x.id === S.captionId);
      if (ph) ph.caption = gv('fCaption');
      save(K.photos, list); S.sheet = null; render(); break;
    }

    case 'saveThing': {
      const t = gv('fTitle');
      if (!t) { alert('先写点内容哦'); return; }
      const list = load(K.things, []);
      list.unshift({ id: uid(), title: t, note: gv('fNote'), done: false });
      save(K.things, list); S.sheet = null; render(); break;
    }
    case 'toggleThing': {
      const list = load(K.things, []);
      const t = list.find(x => x.id === v);
      if (t) { t.done = !t.done; t.doneDate = t.done ? todayStr() : undefined; }
      save(K.things, list); render(); break;
    }
    case 'delThing':
      save(K.things, load(K.things, []).filter(x => x.id !== v)); render(); break;

    case 'saveMood': {
      const list = load(K.moods, []);
      list.unshift({ id: uid(), date: todayStr(), emoji: pickedEmoji, note: gv('fNote'), author: pickedWho || P().name1 });
      save(K.moods, list); S.sheet = null; pickedEmoji = '😍'; render(); break;
    }
    case 'delMood':
      save(K.moods, load(K.moods, []).filter(x => x.id !== v)); render(); break;
    case 'saveWhisper': {
      const t = gv('fText');
      if (!t) { alert('悄悄话不能是空的哦'); return; }
      const list = load(K.whispers, []);
      list.unshift({ id: uid(), text: t, author: pickedWho || P().name1, date: todayStr() });
      save(K.whispers, list); S.sheet = null; render(); break;
    }
    case 'delWhisper':
      save(K.whispers, load(K.whispers, []).filter(x => x.id !== v)); render(); break;

    case 'saveCapsule': {
      const t = gv('fText'), d = $('fDate').value;
      if (!t || !d) { alert('内容和开启日期都要填哦'); return; }
      const list = load(K.capsules, []);
      list.push({ id: uid(), text: t, openDate: d, createdAt: todayStr(), opened: false });
      save(K.capsules, list); S.sheet = null; render(); break;
    }
    case 'openCapsule': {
      const list = load(K.capsules, []);
      const c = list.find(x => x.id === v);
      if (c) c.opened = true;
      save(K.capsules, list); S.opening = v; render(); break;
    }
    case 'delCapsule':
      if (!confirm('确定删除这颗胶囊吗？')) return;
      save(K.capsules, load(K.capsules, []).filter(x => x.id !== v)); render(); break;
  }
});

/* 图片上传与压缩 */
$('fileInput').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  const list = load(K.photos, []);
  const added = [];
  for (const f of files) {
    try {
      const dataUrl = await compress(f);
      const p = { id: uid(), dataUrl, caption: '', date: todayStr() };
      list.unshift(p); added.push(p);
    } catch { /* 跳过失败文件 */ }
  }
  save(K.photos, list);
  added.forEach(p => publishPhoto(p));
  e.target.value = '';
  render();
});
function compress(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 800, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* 老用户升级：已有档案但还没有配对码的，自动生成一个 */
if (S.profile && !SYNC.code) {
  SYNC.code = genCode();
  rawSet('love.syncCode', SYNC.code);
}

/* 邀请链接自动配对：TA 点开带 #join=配对码 的链接就自动加入，不用输码 */
(function autoJoin() {
  const m = (location.hash || '').match(/join=([A-Za-z0-9]{4,})/i);
  try { history.replaceState(null, '', location.pathname + location.search); } catch { /* 忽略 */ }
  if (!m || S.profile) return;
  const c = m[1].toUpperCase();
  SYNC.code = c; rawSet('love.syncCode', c);
  S.joining = true;
  setTimeout(() => { if (S.joining && !S.profile) { S.joining = false; S.joinFailed = true; render(); } }, 15000);
})();

render();
window.__startSync();

/* ============ PWA：安装提示 + 离线缓存 ============ */
(function () {
  // 注册 Service Worker（离线可用）
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const bar = $('installBar'), tip = $('installTip'), btn = $('installBtn');
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (standalone) return; // 已经是 App 模式，不提示
  let deferred = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const dismissed = localStorage.getItem('love.installDismiss');
  if (dismissed) return;

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    tip.textContent = '📲 点右边「立即安装」，装到手机桌面';
    btn.textContent = '立即安装';
    bar.style.display = 'flex';
  });

  if (isIOS) {
    // iPhone：必须用 Safari，手动添加
    tip.textContent = '📲 请用 Safari 打开本页 → 点底部「分享」→「添加到主屏幕」';
    btn.textContent = '知道了';
    bar.style.display = 'flex';
  } else {
    // 安卓：等 3 秒，如果浏览器没有自动安装能力，就显示手动指引
    setTimeout(() => {
      if (!deferred) {
        tip.textContent = '📲 点浏览器菜单（右上角⋮或底部☰）→ 选「安装应用」或「添加到主屏幕」';
        btn.textContent = '知道了';
        bar.style.display = 'flex';
      }
    }, 3000);
  }

  btn.addEventListener('click', async () => {
    if (deferred) {
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
    }
    bar.style.display = 'none';
    localStorage.setItem('love.installDismiss', '1');
  });
  $('installClose').addEventListener('click', () => {
    bar.style.display = 'none';
    localStorage.setItem('love.installDismiss', '1');
  });
})();
</script>
